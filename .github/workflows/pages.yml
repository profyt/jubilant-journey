name: Deploy docs and demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build library
        run: |
          npm ci
          npm run build

      - name: Install and build docs site
        working-directory: site
        env:
          DOCS_BASE: /jubilant-journey/
        run: |
          npm ci
          npm run build

      - name: Install and build demo
        working-directory: examples/vite-react-todos
        env:
          VITE_BASE: /jubilant-journey/demo/
        run: |
          npm ci
          npm run build

      - name: Verify worker assets have no bare imports
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Vite may hash worker chunks without "worker" in the name; scan all JS under assets except the main app bundle.
          mapfile -t assets < <(find examples/vite-react-todos/dist/assets -name '*.js' ! -name 'index-*.js')
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No worker assets found under dist/assets" >&2
            exit 1
          fi
          for f in "${assets[@]}"; do
            if grep -E "from ['\"]idb['\"]" "$f"; then
              echo "Bare idb import in $f — SharedWorker will fail on Pages" >&2
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Assemble Pages artifact (docs + demo)
        run: |
          set -euo pipefail
          mkdir -p site/.vitepress/dist/demo
          cp -a examples/vite-react-todos/dist/. site/.vitepress/dist/demo/
          # Helpful landing note for /demo without trailing slash is handled by Pages + cleanUrls on docs.
          test -f site/.vitepress/dist/index.html
          test -f site/.vitepress/dist/demo/index.html
          echo "Assembled:"
          find site/.vitepress/dist -maxdepth 2 -type f -name 'index.html' -o -name '*.html' | head -40

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
