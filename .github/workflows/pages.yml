name: Deploy docs and demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build library
        run: |
          npm ci
          npm run build

      - name: Install and build docs site
        working-directory: site
        env:
          DOCS_BASE: /jubilant-journey/docs/
          DEMO_URL: https://profyt.github.io/jubilant-journey/
        run: |
          npm ci
          npm run build

      - name: Install and build demo
        working-directory: examples/vite-react-todos
        env:
          VITE_BASE: /jubilant-journey/
        run: |
          npm ci
          npm run build

      - name: Verify worker assets have no bare imports
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Vite may hash worker chunks without "worker" in the name; scan all JS under assets except the main app bundle.
          mapfile -t assets < <(find examples/vite-react-todos/dist/assets -name '*.js' ! -name 'index-*.js')
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No worker assets found under dist/assets" >&2
            exit 1
          fi
          for f in "${assets[@]}"; do
            if grep -E "from ['\"]idb['\"]" "$f"; then
              echo "Bare idb import in $f — SharedWorker will fail on Pages" >&2
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Assemble Pages artifact (demo at / + docs at /docs/)
        run: |
          set -euo pipefail
          rm -rf _pages
          mkdir -p _pages/docs
          # Demo owns the site root (keeps existing live demo URL stable).
          cp -a examples/vite-react-todos/dist/. _pages/
          # Docs under /docs/ (VitePress outDir contents).
          cp -a site/.vitepress/dist/. _pages/docs/
          test -f _pages/index.html
          test -f _pages/docs/index.html
          echo "Assembled:"
          find _pages -maxdepth 2 -type f \( -name 'index.html' -o -name '*.html' \) | sort | head -40

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
