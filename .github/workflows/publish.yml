# Dual-publish worker-sync-db:
#   - registry.npmjs.org as unscoped `worker-sync-db` (primary for consumers)
#   - npm.pkg.github.com as `@profyt/worker-sync-db` (GitHub Packages / Packages tab)
#
# Secrets: repository secret `NPM_TOKEN` (npm automation/granular token with Bypass 2FA).
# GitHub Packages uses the job `GITHUB_TOKEN` with `packages: write`.
#
# Jobs are independent: a missing/invalid NPM_TOKEN does not block GitHub Packages.
# Does not bump versions — bump package.json + CHANGELOG, then tag `vX.Y.Z` or run manually.

name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and dry-run publish only (no upload to registries)'
        type: boolean
        default: false
      target:
        description: 'Which registries to publish'
        type: choice
        options:
          - both
          - npmjs
          - github-packages
        default: both

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node --input-type=commonjs -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      - name: Typecheck, test, build
        run: |
          npm run typecheck
          npm test
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: |
            dist
            package.json
            package-lock.json
            LICENSE
            README.md
            CHANGELOG.md
            AGENTS.md
            llms.txt
            llms-full.txt
          if-no-files-found: error

  publish-npmjs:
    needs: build
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.target == 'both'
      || inputs.target == 'npmjs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Require NPM_TOKEN
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Repository secret NPM_TOKEN is missing or empty. Add an npm automation/granular token with Bypass 2FA under Settings → Secrets → Actions."
            exit 1
          fi

      - name: Publish to npmjs.org (worker-sync-db)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry-run publish to npmjs.org
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: npm publish --access public --ignore-scripts --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-packages:
    needs: build
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.target == 'both'
      || inputs.target == 'github-packages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: .

      # GitHub Packages requires a scoped name under the owner (`@profyt/...`).
      # Source package.json stays unscoped for npmjs; rename only in this job workspace.
      - name: Scope package for GitHub Packages
        run: |
          npm pkg set name='@profyt/worker-sync-db'
          npm pkg set publishConfig.registry='https://npm.pkg.github.com'
          node --input-type=commonjs -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const repo = p.repository && (p.repository.url || p.repository);
            if (!repo || !String(repo).includes('github.com/profyt/jubilant-journey')) {
              console.error('package.json repository must point at github.com/profyt/jubilant-journey');
              process.exit(1);
            }
            console.log('name=', p.name);
            console.log('repository=', JSON.stringify(p.repository));
          "

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@profyt'

      - name: Publish to GitHub Packages (@profyt/worker-sync-db)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry-run publish to GitHub Packages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: npm publish --access public --ignore-scripts --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
